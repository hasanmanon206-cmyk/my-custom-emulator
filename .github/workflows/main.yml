name: Build Emulator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Find Gradle Project & Grant Permissions
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
            echo "PROJECT_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ "${{ env.HAS_WRAPPER }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          else
            gradle assembleRelease --no-daemon || gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Emulator-APK
          path: "**/build/outputs/apk/**/*.apk"
