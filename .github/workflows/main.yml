name: Build Emulator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Locate Project & Build APK
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            echo "Found gradlew in $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties
            ./gradlew assembleRelease --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon
          else
            BUILD_GRADLE=$(find . -name "build.gradle*" | head -n 1)
            if [ -n "$BUILD_GRADLE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_GRADLE")
              cd "$PROJECT_DIR"
              echo "sdk.dir=$ANDROID_HOME" > local.properties
              echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties
              gradle assembleRelease --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon
            else
              echo "No Android project found!"
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Emulator-APK
          path: "**/build/outputs/apk/**/*.apk"
